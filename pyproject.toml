[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardcover-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ingestion = [
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "minio>=7.2.0",
]
transform = [
    "pyspark>=3.5,<4",
    "dbt-duckdb>=1.8,<2",
]
serve = [
    "streamlit>=1.30.0",
    "duckdb>=1.1.0",
    "python-dotenv>=1.0.0",
    "langchain-postgres>=0.0.12",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-classic>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-text-splitters>=0.2.0",
    "sentence-transformers>=3,<6",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

query-experiments = [
    "langchain-classic>=1,<2",
    "langchain-ollama>=1,<2",
    "lark>=1,<2",
]

dashboard = [
    "streamlit>=1.40,<2",
    "plotly>=5,<7",
    "pandas>=2.2,<3",
    "duckdb>=1.1,<2",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires local Gold DuckDB, pgvector and embedding model"]
