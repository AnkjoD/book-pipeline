hardcover_duckdb:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse/gold.duckdb') }}"
      threads: 4
      # Silver parquet đọc trực tiếp qua dbt-duckdb external sources
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY', 'minioadmin') }}"
        s3_region: "{{ env_var('MINIO_REGION', 'us-east-1') }}"
        s3_url_style: "path"
        s3_use_ssl: false
